<script>

let jogos = []

function adicionar() {
    let nome = input_jogo.value
    lista.innerHTML = ""

    if (nome == "") {
        alert("Digite um jogo")
    } else if (jogos.length >= 5) {
        alert("Só pode até 5 jogos")
    } else {
        jogos.push(nome)
        input_jogo.value = ""
        atualizar()
    }
}

function atualizar() {
    lista.innerHTML = ""

    for (let i = 0; i < jogos.length; i++) {
        lista.innerHTML += `<p>${i + 1}º - ${jogos[i]}</p>`
    }
}


let currentSlide = 0;
const totalSlides = 2; 
const wrapper = document.getElementById('carouselWrapper');

function showSlide(index) {
    wrapper.style.transform = `translateX(-${index * 100}%)`;
    currentSlide = index;
}

function nextSlide() {
    currentSlide = (currentSlide + 1) % totalSlides;
    showSlide(currentSlide);
}






</script>
