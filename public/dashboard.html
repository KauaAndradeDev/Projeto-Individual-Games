<div style="width: 700px; height: 400px; margin: auto;">
    <canvas id="myChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('myChart');

var notas = [0,0,0,0,0,0];

var idUsuario = sessionStorage.ID_USUARIO;

fetch(`/quiz/maiorNota?idUsuario=${idUsuario}`)

.then(function(resposta){
    return resposta.json();
})

.then(function(dados){

    for(var i = 0; i < dados.length; i++){

        if(dados[i].nome_quiz == "Ben10"){
            notas[0] = dados[i].maiorNota;
        }

        if(dados[i].nome_quiz == "Dragonballbudokai"){
            notas[1] = dados[i].maiorNota;
        }

        if(dados[i].nome_quiz == "Godofwar"){
            notas[2] = dados[i].maiorNota;
        }

        if(dados[i].nome_quiz == "Residentevil"){
            notas[3] = dados[i].maiorNota;
        }

        if(dados[i].nome_quiz == "Mortal Kombat"){
            notas[4] = dados[i].maiorNota;
        }

        if(dados[i].nome_quiz == "Naruto"){
            notas[5] = dados[i].maiorNota;
        }

    }

    new Chart(ctx, {

        type: 'bar',

        data: {

            labels: [
                'Ben10',
                'Dragonballbudokai',
                'Godofwar',
                'Residentevil',
                'Mortal Kombat',
                'Naruto'
            ],

            datasets: [{
                label: 'Maior Nota',
                data: notas,
                borderWidth: 1
            }]
        },

        options: {

            scales: {
                y: {
                    beginAtZero: true,
                    max: 10
                }
            }
        }
    });

})

.catch(function(erro){
    console.log("Erro:", erro);
});

</script>
