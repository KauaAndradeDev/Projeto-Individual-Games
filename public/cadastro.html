<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Games | Cadastro</title>
    <script src="./js/sessao.js"></script>
    <link rel="stylesheet" href="stylelogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <header>
    <div class="header">

        <a href="index.html" class="logo">
            <img src="./imagem/GamesLogan.png">
        </a>

        <nav>
            <a href="login.html" class="btn">Login</a>
        </nav>

    </div>
</header>

    <div class="login">
        <div class="container">
            <div class="card card-cadastro">
                <h2>Crie sua conta</h2>
                
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>

                <div class="formulario">
                    <div class="campo">
                        <span>Nome</span>
                        <input id="nome_input" type="text" placeholder="Seu nome">
                    </div>
                    <div class="campo">
                        <span>E-mail</span>
                        <input id="email_input" type="text" placeholder="seu@email.com">
                    </div>
                    <div class="campo">
                        <span>Senha</span>
                        <input id="senha_input" type="password" placeholder="••••••">
                    </div>
                    <div class="campo">
                        <span>Confirmar senha</span>
                        <input id="confirmacao_senha_input" type="password" placeholder="••••••">
                    </div>
                    <button class="botao" onclick="cadastrar()">Cadastrar</button>
                </div>

                <p class="cadastro">
                    Já tem conta? <a href="login.html">Fazer login</a>
                </p>
            </div>
        </div>
    </div>

</body>

</html>

<script>
    function cadastrar() {
      

        var nomeVar = nome_input.value.trim();
        var emailVar = email_input.value.trim();
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;

     
        if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
            exibirErro("Todos os campos devem ser preenchidos!");
            return false;
        }

        
        if (nomeVar.length < 3) {
            exibirErro("O nome deve conter pelo menos 3 caracteres.");
            return false;
        }

        // 3. Validação do E-mail (contém @ e .)
        if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".com") == -1) {
            exibirErro("E-mail inválido. Deve conter '@' e '.com'.");
            return false;
        }

        
        if (senhaVar.length < 6) {
            exibirErro("A senha deve ter pelo menos 6 caracteres.");
            return false;
        }

        
        if (senhaVar != confirmacaoSenhaVar) {
            exibirErro("A confirmação de senha deve ser igual à senha.");
            return false;
        }

       
        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
            }),
        }).then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
                cardErro.style.display = "block";
                cardErro.classList.add("sucesso");
                mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
                
                setTimeout(() => {
                    window.location = "login.html";
                }, "2000");

                limparFormulario(); 
                // finalizarAguardar();
            } else {
                throw "Houve um erro ao tentar realizar o cadastro!";
            }
        }).catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            // finalizarAguardar();
        });

        return false;
    }

   
    function exibirErro(mensagem) {
        cardErro.style.display = "block";
        cardErro.classList.remove("sucesso");
        mensagem_erro.innerHTML = mensagem;
        setTimeout(sumirMensagem, 5000);
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
</script>
