<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K Games | Quiz</title>

    <link rel="stylesheet" href="stylequiz.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <header>

        <div class="header">

            <a href="index.html" class="logo">
                <img src="./imagem/GamesLogan.png">
            </a>

            <nav>
                <a href="./dashboard.html">Dashboard</a>
                <a href="./top5.html">Top 5</a>
                <a href="./paginadeEntrada.html">Página Principal</a>
                <a href="./index.html">Sair</a>
            </nav>

        </div>

    </header>

    <div class="titulo-quiz">

        <img src="./imagem/imagemLETREIRO.png">

    </div>

    <section class="carousel">

        <button class="carousel-btn" onclick="anterior()">
            ❮
        </button>

        <div class="slide" id="slide1">

            <a href="./quizBen10.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/Ben10.jpg">

                    <h3>Ben 10</h3>

                </div>

            </a>

            <a href="./quizGodofwar.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/godofwar.jpg">

                    <h3>God of War</h3>

                </div>

            </a>

            <a href="./quizNaruto.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/naruto.jpg">

                    <h3>Naruto</h3>

                </div>

            </a>

        </div>

        <div class="slide" id="slide2">

            <a href="./quizResidentevil.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/residentevil.jpg">

                    <h3>Resident Evil</h3>

                </div>

            </a>

            <a href="./quizMortalKombat.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/mortalKombar.jpg">

                    <h3>Mortal Kombat</h3>

                </div>

            </a>

            <a href="./quizDragonballbudokai.html" class="card-link">

                <div class="game-card">

                    <img src="./imagem/dragonballbudokai.jpg">

                    <h3>Dragon Ball</h3>

                </div>

            </a>

        </div>

        <button class="carousel-btn" onclick="proximo()">
            ❯
        </button>

    </section>

    <script>

        let atual = 1

        function proximo() {

            if (atual == 1) {

                slide1.style.display = "none"
                slide2.style.display = "flex"

                atual = 2

            } else {

                slide2.style.display = "none"
                slide1.style.display = "flex"

                atual = 1
            }
        }

        function anterior() {

            if (atual == 2) {

                slide2.style.display = "none"
                slide1.style.display = "flex"

                atual = 1

            } else {

                slide1.style.display = "none"
                slide2.style.display = "flex"

                atual = 2
            }
        }

    </script>

</body>

</html>
