<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K Games | Top 5</title>

    <link rel="stylesheet" href="stylequiz.css">
</head>

<body style="background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url('./imagem/fotofundogamesteste.jpg');

background-position: center center;
background-repeat: no-repeat;
background-size: cover;
background-attachment: fixed;

min-height: 100vh;
width: 100%;
margin: 0;
padding: 0;">

    <header>

        <div class="header">

            <a href="index.html" class="logo">
                <img src="./imagem/GamesLogan.png">
            </a>

            <nav>
                <a href="./dashboard.html">Dashboard</a>
                <a href="./top5.html">Top 5</a>
                <a href="./paginadeEntrada.html">Página Principal</a>
                <a href="./index.html">Sair</a>
            </nav>

        </div>

    </header>

    <br><br><br>

    <div  style="display: flex; justify-content: center; margin-top: 40px; margin-top: 0px; margin-bottom: -200px"">

        <img src="./imagem/imagemLETREIRO.png"
        style="width:800px;">

    </div>

    <section class="carousel">

        <div class="slide" id="slide1">

            <a href="./quizBen10.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/Ben10.jpg">
                    <h3>Ben 10</h3>
                </div>

            </a>

            <a href="./quizGodofwar.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/godofwar.jpg">
                    <h3>God of War</h3>
                </div>

            </a>

            <a href="./quizNaruto.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/naruto.jpg">
                    <h3>Naruto</h3>
                </div>

            </a>

        </div>

        <div class="slide" id="slide2">

            <a href="./quizResidentevil.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/residentevil.jpg">
                    <h3>Resident Evil</h3>
                </div>

            </a>

            <a href="./quizMortalKombat.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/mortalKombar.jpg">
                    <h3>Mortal Kombat</h3>
                </div>

            </a>

            <a href="./quizDragonballbudokai.html" class="card-link">

                <div class="game-card">
                    <img src="./imagem/dragonballbudokai.jpg">
                    <h3>Dragon Ball</h3>
                </div>

            </a>

        </div>

    </section>

    <div class="botao">

        <button class="carousel-btn" onclick="proximo()">
            Próximo
        </button>

    </div>

<script>

    let atual = 1

    function proximo(){

        if(atual == 1){

            slide1.style.display = "none"
            slide2.style.display = "flex"

            atual = 2

        } else {

            slide2.style.display = "none"
            slide1.style.display = "flex"

            atual = 1
        }
    }

</script>

</body>

</html>
