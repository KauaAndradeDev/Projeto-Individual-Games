<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>KL Games | Quiz Ben 10</title>
<link rel="stylesheet" href="stylequiz.css">
</head>

<body>

<div id="container">

    <div id="jogo" class="card">

        <p>
            Questão
            <span id="num"></span> /
            <span id="total"></span>
        </p>

        <h3 id="pergunta"></h3>

        <div id="opcoes"></div>

        <button onclick="responder()">
            Responder
        </button>

    </div>

    <div id="final" class="card" style="display:none">

        <h2>Resultado</h2>

        <p id="resultado"></p>

        <button onclick="location.reload()">
            Tentar novamente
        </button>

    </div>

</div>

<script>

if (!sessionStorage.ID_USUARIO) {

    alert("Faça login primeiro")

    window.location = "login.html"
}

const perguntas = [

    {
        pergunta: "Qual é o dispositivo do Ben?",
        opcoes: ["Omnitrix","Relógio","Portador","Transforma"],
        correta: 0
    },

    {
        pergunta: "Quem é a prima do Ben?",
        opcoes: ["Gwen","Kevin","Max","Julie"],
        correta: 0
    },

    {
        pergunta: "Primeiro alien?",
        opcoes: ["4 braços","Lança Chamas","XLR8","Diamante"],
        correta: 1
    },

    {
        pergunta: "Vilão principal?",
        opcoes: ["Vilgax","Animo","Hex","Ghost"],
        correta: 0
    }

]

let atual = 0
let acertos = 0

total.innerHTML = perguntas.length

carregarPergunta()

function carregarPergunta() {

    pergunta.innerHTML = perguntas[atual].pergunta

    num.innerHTML = atual + 1

    opcoes.innerHTML = ""

    for (let i = 0; i < perguntas[atual].opcoes.length; i++) {

        opcoes.innerHTML += `
        
        <label class="option">

            <input type="radio" name="opcao" value="${i}">

            ${perguntas[atual].opcoes[i]}

        </label>
        
        `
    }
}

function responder() {

    let escolha =
    document.querySelector('input[name="opcao"]:checked')

    if (!escolha) {

        alert("Escolha uma opção!")

        return
    }

    if (
        parseInt(escolha.value) ==
        perguntas[atual].correta
    ) {

        acertos++
    }

    atual++

    if (atual < perguntas.length) {

        carregarPergunta()

    } else {

        finalizarJogo()
    }
}

function finalizarJogo() {

    let nota = (acertos / perguntas.length) * 10

    jogo.style.display = "none"

    final.style.display = "block"

    resultado.innerHTML = `
    
    Você acertou ${acertos}
    de ${perguntas.length}

    <br><br>

    Nota: ${nota.toFixed(1)}
    
    `

    fetch("/quiz/salvarResultado", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            idUsuario: sessionStorage.ID_USUARIO,
            quiz: "Ben10",
            nota: nota

        })

    })

}

</script>

</body>
</html>
