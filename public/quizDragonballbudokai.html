<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Ben 10</title>
    <link rel="stylesheet" href="stylequiz.css">
</head>

<body>

    <div id="pontuacaoEJogo">

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">

            <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">

                <span>
                    Quantidade de acertos:
                    <span id="spanCertas">0</span>
                </span>

                <br>

                <span>
                    Quantidade de erros:
                    <span id="spanErradas">0</span>
                </span>

            </div>

            <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">

                <span id="pontuacaoFinal">

                    Pontuação Final:
                    <span id="spanPontuacaoFinal"></span>

                </span>

                <br>

                <span id="msgFinal"></span>

            </div>

        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

            <div id="infoQuestao" class="padding-8">

                <span>

                    Questão atual:
                    <span id="spanNumeroDaQuestaoAtual"></span>

                    de

                    <span id="qtdQuestoes"></span>

                    questões

                </span>

            </div>

            <br>

            <div id="perguntaDaQuestaoAtual" class="padding-8">

                <span id="spanQuestaoExibida"></span>

            </div>

            <br>

            <div id="infoAlternativas" class="padding-8">

                <span>
                    Escolha uma opção:
                </span>

            </div>

            <br>

            <div id="opcoes" class="flex-colunar padding-8">

                <span>

                    <input type="radio" id="primeiraOpcao" name="option" value="alternativaA">

                    <label for="primeiraOpcao" id="labelOpcaoUm"></label>

                </span>

                <br>

                <span>

                    <input type="radio" id="segundaOpcao" name="option" value="alternativaB">

                    <label for="segundaOpcao" id="labelOpcaoDois"></label>

                </span>

                <br>

                <span>

                    <input type="radio" id="terceiraOpcao" name="option" value="alternativaC">

                    <label for="terceiraOpcao" id="labelOpcaoTres"></label>

                </span>

                <br>

                <span>

                    <input type="radio" id="quartaOpcao" name="option" value="alternativaD">

                    <label for="quartaOpcao" id="labelOpcaoQuatro"></label>

                </span>

            </div>

            <br>

            <div id="botoes" class="padding-8">

                <button onclick="submeter()">
                    Responder
                </button>

            </div>

        </div>

    </div>

</body>

</html>

<script>

if (!sessionStorage.ID_USUARIO) {

    alert("Faça login primeiro")

    window.location = "login.html"
}

pontuacao.style.display = "flex"
jogo.style.display = "flex"
pontuacaoFinalJogo.style.display = "none"

const listaDeQuestoes = [

    {
        pergunta: "O que é o Omnitrix?",
        alternativaA: "Relógio",
        alternativaB: "Carro",
        alternativaC: "Espada",
        alternativaD: "Alien",
        alternativaCorreta: "alternativaA"
    },

    {
        pergunta: "Quem é a prima do Ben?",
        alternativaA: "Julie",
        alternativaB: "Gwen",
        alternativaC: "Kai",
        alternativaD: "Charmcaster",
        alternativaCorreta: "alternativaB"
    },

    {
        pergunta: "Qual alien é mais rápido?",
        alternativaA: "4 braços",
        alternativaB: "XLR8",
        alternativaC: "Diamante",
        alternativaD: "Ultra T",
        alternativaCorreta: "alternativaB"
    }

]

let numeroDaQuestaoAtual = 0
let certas = 0
let erradas = 0

qtdQuestoes.innerHTML = listaDeQuestoes.length

spanNumeroDaQuestaoAtual.innerHTML = 1

spanQuestaoExibida.innerHTML =
listaDeQuestoes[0].pergunta

labelOpcaoUm.innerHTML =
listaDeQuestoes[0].alternativaA

labelOpcaoDois.innerHTML =
listaDeQuestoes[0].alternativaB

labelOpcaoTres.innerHTML =
listaDeQuestoes[0].alternativaC

labelOpcaoQuatro.innerHTML =
listaDeQuestoes[0].alternativaD

function submeter() {

    let opcoes = document.getElementsByName("option")

    let respostaEscolhida = ""

    for (let i = 0; i < opcoes.length; i++) {

        if (opcoes[i].checked) {

            respostaEscolhida = opcoes[i].value
        }
    }

    if (respostaEscolhida == "") {

        alert("Escolha uma alternativa")

        return
    }

    if (
        respostaEscolhida ==
        listaDeQuestoes[numeroDaQuestaoAtual].alternativaCorreta
    ) {

        certas++

        spanCertas.innerHTML = certas

    } else {

        erradas++

        spanErradas.innerHTML = erradas
    }

    numeroDaQuestaoAtual++

    if (numeroDaQuestaoAtual < listaDeQuestoes.length) {

        spanNumeroDaQuestaoAtual.innerHTML =
        numeroDaQuestaoAtual + 1

        spanQuestaoExibida.innerHTML =
        listaDeQuestoes[numeroDaQuestaoAtual].pergunta

        labelOpcaoUm.innerHTML =
        listaDeQuestoes[numeroDaQuestaoAtual].alternativaA

        labelOpcaoDois.innerHTML =
        listaDeQuestoes[numeroDaQuestaoAtual].alternativaB

        labelOpcaoTres.innerHTML =
        listaDeQuestoes[numeroDaQuestaoAtual].alternativaC

        labelOpcaoQuatro.innerHTML =
        listaDeQuestoes[numeroDaQuestaoAtual].alternativaD

        for (let i = 0; i < opcoes.length; i++) {

            opcoes[i].checked = false
        }

    } else {

        finalizarJogo()
    }

}

function finalizarJogo() {

    jogo.style.display = "none"

    pontuacaoFinalJogo.style.display = "flex"

    let nota = (certas / listaDeQuestoes.length) * 10

    spanPontuacaoFinal.innerHTML = nota.toFixed(1)

    msgFinal.innerHTML = `
    
    Você acertou ${certas} de ${listaDeQuestoes.length}
    
    <br><br>

    Nota: ${nota.toFixed(1)}
    
    `

    fetch("/quiz/salvarResultado", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            idUsuario: sessionStorage.ID_USUARIO,
            quiz: "Ben10",
            nota: nota

        })

    })

}

</script>
