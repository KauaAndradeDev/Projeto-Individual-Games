<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>KL Games | Top 5</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <script src="./js/sessao.js"></script>

</head>

<body style="
background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url('./imagem/fotofundogamesteste.jpg');

background-position:center;
background-repeat:no-repeat;
background-size:cover;
background-attachment:fixed;

min-height:100vh;
margin:0;
">

    <header>

        <div class="header">

            <a href="index.html" class="logo">

                <img src="./imagem/GamesLogan.png">

            </a>

            <nav>

                <a href="./dashboard.html">
                    Dashboard
                </a>

                <a href="./geralquiz.html">
                    Quiz
                </a>

                <a href="./paginadeEntrada.html">
                    Página Principal
                </a>

                <a href="index.html" onclick="limparSessao()">

                    Sair

                </a>

            </nav>

        </div>

    </header>
<br><br><br><br><br><br><br><br><br><br>
    <div style="
    display:flex;
    justify-content:center;
    margin-bottom:-150px;
    ">

        <img src="./imagem/LetreiroTop5Editado.png"
            style="width:500px;">

    </div>

    <div class="top5">

        <div class="container">

            <div class="card">

                <h2>
                    Monte seu Top 5
                </h2>

                <div class="formulario">

                    <div class="campo">

                        <span>
                            Nome do jogo
                        </span>

                        <input id="input_jogo"
                            type="text"
                            placeholder="Digite um jogo">

                    </div>

                    <button class="botao" onclick="adicionar()">

                        Adicionar

                    </button>

                </div>

                <div id="lista" class="lista-top5">

                </div>

                <button class="botao"
                    style="margin-top:20px;"
                    onclick="limparLista()">

                    Limpar Lista

                </button>

            </div>

        </div>

    </div>

</body>

</html>

<script>

    let jogos = []

    function adicionar() {

        let nome = input_jogo.value

        if (nome == "") {

            alert("Digite um jogo")

        } else if (jogos.length >= 5) {

            alert("Seu Top 5 já está completo")

        } else {

            jogos.push(nome)

            input_jogo.value = ""

            atualizar()
        }
    }

    function atualizar() {

        lista.innerHTML = ""

        for (let i = 0; i < jogos.length; i++) {

            lista.innerHTML += `

            <div class="item-jogo">

                <span>

                    ${i + 1}º Lugar

                </span>

                <h3>

                    ${jogos[i]}

                </h3>

            </div>

            `
        }
    }

    function limparLista() {

        jogos = []

        atualizar()
    }

</script>
